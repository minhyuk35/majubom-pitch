<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1117">
<title>마주봄 발표 대응 노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f6f7f9;--card:#ffffff;--card-2:#f0f2f6;--line:#dfe3ea;
  --t1:#15171c;--t2:#4b5160;--t3:#7a8190;
  --accent:#3b6fe0;--accent-soft:rgba(59,111,224,.1);
  --warn:#b7791f;--warn-soft:rgba(214,158,46,.14);
  --bad:#d6405b;--bad-soft:rgba(214,64,91,.1);
  --ok:#1f9d6b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1117;--card:#1a1d27;--card-2:#22262f;--line:#2e3340;
    --t1:#f0f1f4;--t2:#b3b7c2;--t3:#7c8191;
    --accent:#7aa2ff;--accent-soft:rgba(122,162,255,.13);
    --warn:#f5c451;--warn-soft:rgba(245,196,81,.13);
    --bad:#ff8aa0;--bad-soft:rgba(255,138,160,.12);
    --ok:#4ad7a0;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1117;--card:#1a1d27;--card-2:#22262f;--line:#2e3340;
  --t1:#f0f1f4;--t2:#b3b7c2;--t3:#7c8191;
  --accent:#7aa2ff;--accent-soft:rgba(122,162,255,.13);
  --warn:#f5c451;--warn-soft:rgba(245,196,81,.13);
  --bad:#ff8aa0;--bad-soft:rgba(255,138,160,.12);
  --ok:#4ad7a0;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--t1);font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,'Malgun Gothic',sans-serif;font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 96px}

header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 0 10px}
header .wrap{padding-bottom:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.top h1{font-size:18px;font-weight:900;letter-spacing:-.01em}
.top .tools{display:flex;gap:6px}
.btn{font:inherit;font-size:13px;font-weight:700;color:var(--t2);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;font:inherit;font-size:14px;font-weight:800;color:var(--t2);background:var(--card);border:1px solid var(--line);border-radius:100px;padding:7px 14px;cursor:pointer}
.tab[aria-selected="true"]{color:#fff;background:var(--accent);border-color:var(--accent)}
#q{width:100%;font:inherit;font-size:16px;color:var(--t1);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
#q::placeholder{color:var(--t3)}

.panel{padding-top:16px}
.panel[hidden]{display:none}
.panel-title{font-size:13px;font-weight:800;color:var(--t3);margin:6px 2px 10px}
.summary{background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.summary b{display:block;font-size:13px;color:var(--accent);margin-bottom:4px}
.summary p{font-size:16px;font-weight:700}
.legend{font-size:13px;color:var(--t3);margin:0 2px 14px}
.legend span{display:inline-block;margin-right:10px}

details.slide{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
details.slide>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:baseline;gap:10px}
details.slide>summary::-webkit-details-marker{display:none}
.no{flex:0 0 auto;font-size:13px;font-weight:900;color:var(--accent);min-width:22px}
.st{font-size:17px;font-weight:900}
.st small{display:block;font-size:13px;font-weight:600;color:var(--t3);margin-top:1px}
details.slide[open]>summary{border-bottom:1px solid var(--line)}
.sbody{padding:12px 16px 16px}
.sec{font-size:12.5px;font-weight:900;letter-spacing:.04em;color:var(--t3);margin:14px 0 6px}
.sec:first-child{margin-top:2px}
ul.lines{list-style:none;display:grid;gap:6px}
ul.lines li{position:relative;padding-left:14px;font-size:15.5px}
ul.lines li::before{content:'';position:absolute;left:2px;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
ul.say li::before{background:var(--ok)}
ul.dont li::before{background:var(--bad)}
.say-box{background:var(--card-2);border-radius:10px;padding:10px 12px}

details.q{border-left:3px solid var(--line);margin:8px 0 0;padding-left:8px}
details.q>summary{list-style:none;cursor:pointer;font-size:15.5px;font-weight:800;color:var(--t1);padding:3px 0;display:flex;gap:6px}
details.q>summary::-webkit-details-marker{display:none}
details.q>summary::before{content:'Q';flex:0 0 auto;font-size:12px;font-weight:900;color:#fff;background:var(--accent);border-radius:5px;padding:1px 5px;height:fit-content;margin-top:3px}
details.q[open]{border-left-color:var(--accent)}
details.q .a{font-size:15.5px;color:var(--t2);padding:4px 0 2px 24px}
details.q .a::before{content:'A ';font-weight:900;color:var(--ok)}
.fol{padding-left:4px}
.fol>.fl{font-size:12px;font-weight:800;color:var(--t3);margin:6px 0 0 12px}
.chk{display:inline-block;font-size:12px;font-weight:800;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:0 6px;margin-left:4px}
b{font-weight:800;color:var(--t1)}

.gl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px}
.gl dt{font-size:16px;font-weight:900}
.gl dd{font-size:15px;color:var(--t2);margin-top:2px}
.dn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.dn .x{font-size:15.5px;color:var(--bad);font-weight:800;text-decoration:line-through;text-decoration-thickness:1px}
.dn .o{font-size:15.5px;color:var(--ok);font-weight:800;margin-top:4px}
.dn .w{font-size:14px;color:var(--t2);margin-top:4px}
.empty{color:var(--t3);font-size:15px;padding:24px 4px;text-align:center}
#toTop{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:9;font:inherit;font-size:14px;font-weight:800;color:#fff;background:var(--accent);border:0;border-radius:100px;padding:10px 14px;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer}
footer{font-size:12.5px;color:var(--t3);margin-top:18px;line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>마주봄 발표 대응 노트</h1>
      <div class="tools"><button class="btn" id="expand">모두 펼치기</button><button class="btn" id="theme">테마</button></div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-p="booth" aria-selected="true">부스 영상 v2</button>
      <button class="tab" role="tab" data-p="tech" aria-selected="false">기술 검증 자료</button>
      <button class="tab" role="tab" data-p="dont" aria-selected="false">쓰면 안 되는 말</button>
      <button class="tab" role="tab" data-p="gloss" aria-selected="false">용어 한 줄</button>
    </div>
    <input id="q" type="search" placeholder="질문 키워드 검색 (예: 정확도, 1.2m, 개인정보)" autocomplete="off">
  </div>
</header>

<main class="wrap">
  <section class="panel" id="p-booth"></section>
  <section class="panel" id="p-tech" hidden></section>
  <section class="panel" id="p-dont" hidden></section>
  <section class="panel" id="p-gloss" hidden></section>
  <p class="empty" id="none" hidden>검색 결과가 없습니다.</p>
  <footer>모든 수치는 프로젝트 저장소(github.com/b-hyoung/Majubom) 실측 기록과 인용 논문 기준입니다. <span class="chk">확인 필요</span> 표시는 원문이나 팀 기록으로 한 번 더 확인할 항목입니다.</footer>
</main>
<button id="toTop" aria-label="맨 위로">↑ 위로</button>

<script>
/* 구조: 장마다 key(꼭 알아야 할 것) · say(한 줄 설명) · qa(예상 질문, f = 꼬리 질문) · dont(하지 말 말) */
var CHK=' <span class="chk">확인 필요</span>';

var BOOTH={
  summary:'몸에 붙이지 않는 센서 2종(mmWave·ToF)으로 침대 위 자세와 침대 밖 걸음을 보고, 환자 본인의 평소와 비교한 위험 단계를 간호사 화면에 띄우는 시제품입니다.',
  slides:[
  {no:1,t:'타이틀',s:'비접촉 센서융합 기반 치매환자 낙상예측시스템',
   key:['과제명은 <b>비접촉 센서융합 기반 치매환자 낙상예측시스템</b>입니다.',
        '핵심은 착용 없음 · 촬영 없음 · 낙상 전 위험 신호 확인 세 가지입니다.',
        '낙상 자체를 맞히는 모델이 아니라 <b>낙상 전 위험 신호를 먼저 보여주는 시스템</b>입니다.'],
   say:['몸에 아무것도 붙이지 않고 영상도 찍지 않습니다.',
        '침대 위 자세와 침대 밖 걸음을 보고 위험 단계를 간호사 화면에 띄웁니다.'],
   qa:[
    {q:'제목에 예측이 있는데 실제로 낙상을 예측하나요?',a:'낙상 자체를 맞히는 모델은 아닙니다. 걸터앉음 · 가장자리 쏠림 · 평소와 다른 걸음 같은 낙상 전 위험 신호를 먼저 확인합니다.',f:[
      {q:'그럼 낙상 예측 정확도는 몇 %인가요?',a:'아직 말할 수 없습니다. 실제 낙상 정답 데이터가 없어서 측정하지 않았습니다.',f:[
        {q:'그럼 무엇을 검증했나요?',a:'자세 구분 정확도(1명 기준 97.9%)와 판정 흐름이 실제로 동작하는지를 확인했습니다.',f:[
          {q:'97.9%면 높은 것 아닌가요?',a:'같은 날 같은 사람 데이터로 평가한 값이라 새 환자에게 그대로 나온다고 볼 수 없습니다.'}]},
        {q:'실제 낙상 데이터는 언제 확보하나요?',a:'요양시설 실증이 다음 단계입니다. 일정은 아직 확정되지 않았습니다.'}]}]},
    {q:'센서융합이면 두 센서 값을 섞어서 판단하나요?',a:'두 센서가 각자 낸 위험 단계 중 더 높은 단계를 대표값으로 씁니다.',f:[
      {q:'그건 융합이라기엔 단순하지 않나요?',a:'맞습니다. 판정 결과를 합치는 단순한 방식입니다. 값을 섞어 학습하는 방식도 실험했지만 한 센서만 쓸 때보다 나아지지 않았습니다.',f:[
        {q:'얼마나 안 나왔나요?',a:'3초 뒤 이탈을 맞히는 실험에서 ToF 단독 F1 0.667, 값을 섞은 방식 0.000, 결과를 합친 방식 0.500이었습니다. 시험 표본이 15건뿐이라 참고용입니다.'}]}]},
    {q:'시제품인가요, 실제 병원에서 쓰고 있나요?',a:'시제품입니다. 개발 환경에서 시연했고 요양시설 실증은 아직 하지 않았습니다.'},
    {q:'치매 환자가 아닌 일반 어르신도 쓸 수 있나요?',a:'센서 자체는 대상을 가리지 않습니다. 착용 거부 문제가 큰 치매 환자를 목표로 잡았고 치매 환자 데이터로 검증하지는 않았습니다.'}],
   dont:['낙상을 97.9% 예측합니다.','임상 검증을 마쳤습니다.']},

  {no:2,t:'기술개발 배경',s:'빈도 → 시점 → 한계 → 목표',
   key:['국내 요양병원에서 보고된 낙상사고 <b>5,107건 중 2,008건(39.3%)</b>이 치매 환자입니다. 2021–2024년 자료입니다.',
        '치매 환자 낙상은 <b>밤 근무 시간대(OR 1.51)와 화장실·샤워실(OR 1.74)</b>에서 다칠 가능성이 더 높았습니다.',
        'OR은 낙상 빈도가 아니라 <b>낙상했을 때 다칠 가능성</b>에 대한 수치입니다.',
        '기존 방식의 공백은 착용 거부 · 사생활 침해 · 사후 감지 세 가지로 정리했습니다.'],
   say:['요양병원 낙상사고 10건 중 4건은 치매 환자에게서 일어납니다.',
        '특히 밤과 화장실에서 넘어졌을 때 다칠 가능성이 더 높습니다.',
        '이 순간을 사람이 계속 지켜보기는 어렵습니다.',
        '그래서 착용과 촬영 없이 위험 신호를 먼저 확인하는 것을 목표로 했습니다.'],
   qa:[
    {q:'10건 중 4건은 어디서 나온 숫자인가요?',a:'KCI 논문 「국내 요양병원 최근 4년(2021–2024년) 낙상사고 분석 – 치매군과 비치매군 비교를 중심으로」입니다. 보고된 낙상사고 5,107건 중 치매군이 2,008건입니다.',f:[
      {q:'보고된 사고만 센 거면 실제보다 적지 않나요?',a:'맞습니다. 보고되지 않은 낙상은 빠져 있어서 실제 규모는 더 클 수 있습니다.'},
      {q:'요양병원은 원래 치매 환자가 많으니 당연한 비율 아닌가요?',a:'맞는 지적입니다. 이 숫자는 치매 환자가 더 잘 넘어진다는 뜻이 아니라 낙상사고의 상당수가 치매 환자에게서 난다는 규모를 보여줍니다.',f:[
        {q:'그럼 치매가 낙상 위험을 높인다는 근거는요?',a:'해외 연구에서 치매 노인은 매년 60–80%가 낙상을 겪고 인지 기능이 정상인 노인의 약 2배로 보고됩니다.',f:[
          {q:'그 출처는요?',a:'Shaw(2003) 「Falls in Older People With Dementia」와 「Falls and Alzheimer Disease」 리뷰(PMC10977097)입니다.'}]}]}]},
    {q:'OR 1.51이면 1.5배 위험하다는 뜻인가요?',a:'정확히는 오즈비입니다. 다칠 오즈가 약 1.5배라는 뜻이라 발표에서는 다칠 가능성이 더 높다까지만 말합니다.',f:[
      {q:'오즈비와 위험비는 뭐가 다른가요?',a:'오즈는 일어날 확률을 안 일어날 확률로 나눈 값입니다. 결과가 흔할수록 오즈비가 실제 확률 차이보다 크게 나옵니다.',f:[
        {q:'이 논문에서는 차이가 큰가요?',a:'치매군 낙상의 위해 발생 비율이 81.6%로 흔한 결과라 실제 확률 차이는 1.5배보다 작습니다. 그래서 배라는 표현을 쓰지 않습니다.'}]},
      {q:'어떤 시간대와 비교한 값인가요?',a:'논문의 기준 범주와 비교한 값입니다. 기준 범주는 원문 표에서 확인해야 합니다.'+CHK},
      {q:'밤에 낙상이 더 많이 난다는 뜻인가요?',a:'아닙니다. 낙상이 일어났을 때 다칠 가능성이 높다는 뜻이고 낙상 발생 빈도를 비교한 수치가 아닙니다.'}]},
    {q:'기존 방식의 공백 세 가지는 연구로 확인한 건가요?',a:'기존 방식의 구조적 한계를 정리한 것입니다. 저희가 직접 측정한 비교 수치는 없습니다.',f:[
      {q:'착용 거부는 근거가 있나요?',a:'이번 자료에 수치로 제시하지는 않습니다. 인지 저하 환자에게 기기 착용 유지가 어렵다는 현장 문제를 출발점으로 삼았습니다.'}]},
    {q:'1인실만 대상인가요? 다인실은요?',a:'현재는 요양병원 1인실 · 침대 1개 기준입니다. 다인실은 시험하지 않았습니다.'}],
   dont:['치매 환자 10명 중 4명이 넘어집니다.','야간에 낙상이 1.5배 많습니다.']},

  {no:3,t:'기존 방식과의 차이',s:'접촉→비접촉 · 영상→비영상 · 사후→사전',
   key:['웨어러블 → <b>비접촉</b>: 몸에 붙이지 않고 침대 주변에 설치합니다.',
        '카메라 → <b>비영상</b>: 거리·위치 값만 남고 사람 모습은 남지 않습니다.',
        '압력 매트 → <b>사전</b>: 이탈 전 걸터앉음과 가장자리 쏠림을 확인합니다.',
        '배경 3번 카드의 세 한계와 1:1로 대응합니다.'],
   say:['웨어러블은 인지 저하로 착용 거부나 임의 제거가 잦습니다.',

function el(tag,cls,html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function lines(arr,cls){ var u=el('ul','lines'+(cls?' '+cls:'')); arr.forEach(function(t){ u.appendChild(el('li',null,t)); }); return u; }
function qaList(list){
  var frag=document.createDocumentFragment();
  list.forEach(function(it){
    var d=el('details','q'); d.appendChild(el('summary',null,it.q)); d.appendChild(el('div','a',it.a));
    if(it.f&&it.f.length){ var w=el('div','fol'); w.appendChild(el('div','fl','↳ 꼬리 질문')); w.appendChild(qaList(it.f)); d.appendChild(w); }
    frag.appendChild(d);
  });
  return frag;
}

  host.appendChild(el('div','panel-title',label));
  var s=el('div','summary'); s.appendChild(el('b',null,'30초 요약')); s.appendChild(el('p',null,deck.summary)); host.appendChild(s);
  host.appendChild(el('div','legend','<span>● 꼭 알아야 할 것</span><span style="color:var(--ok)">● 한 줄 설명</span><span>Q 예상 질문</span>'));
  deck.slides.forEach(function(sl){
    var d=el('details','slide');
    d.appendChild(el('summary',null,'<span class="no">'+String(sl.no).padStart(2,'0')+'</span><span class="st">'+sl.t+'<small>'+sl.s+'</small></span>'));
    var b=el('div','sbody');
    b.appendChild(el('div','sec','꼭 알아야 할 것')); b.appendChild(lines(sl.key));
    if(sl.say&&sl.say.length){ b.appendChild(el('div','sec','한 줄 설명')); var sb=el('div','say-box'); sb.appendChild(lines(sl.say,'say')); b.appendChild(sb); }
    if(sl.qa&&sl.qa.length){ b.appendChild(el('div','sec','예상 질문 · 꼬리 질문')); b.appendChild(qaList(sl.qa)); }
    if(sl.dont&&sl.dont.length){ b.appendChild(el('div','sec','이 장에서 하지 말 말')); b.appendChild(lines(sl.dont,'dont')); }
    d.appendChild(b); host.appendChild(d);
  });
}
renderDeck(document.getElementById('p-booth'),BOOTH,'부스 영상 v2 · 12장');
renderDeck(document.getElementById('p-tech'),TECH,'기술 검증 자료 · 18장');
(function(){
  var h=document.getElementById('p-dont'); h.appendChild(el('div','panel-title','쓰면 안 되는 말 → 대신 이렇게'));
  DONT.forEach(function(r){ var c=el('div','dn'); c.appendChild(el('div','x',r.x)); c.appendChild(el('div','o','→ '+r.o)); c.appendChild(el('div','w',r.w)); h.appendChild(c); });
  var g=document.getElementById('p-gloss'); g.appendChild(el('div','panel-title','용어 한 줄 정리'));
  GLOSS.forEach(function(r){ var c=el('dl','gl'); c.appendChild(el('dt',null,r[0])); c.appendChild(el('dd',null,r[1])); g.appendChild(c); });
})();

/* ── 탭 · 검색 · 펼치기 ── */
var panels={booth:'p-booth',tech:'p-tech',dont:'p-dont',gloss:'p-gloss'}, cur='booth';
var tabs=[].slice.call(document.querySelectorAll('.tab'));
function show(p){
  cur=p;
  tabs.forEach(function(t){ t.setAttribute('aria-selected',t.dataset.p===p?'true':'false'); });
  Object.keys(panels).forEach(function(k){ document.getElementById(panels[k]).hidden=(k!==p); });
  try{ localStorage.setItem('mjb-tab',p); }catch(e){}
}
tabs.forEach(function(t){ t.onclick=function(){ document.getElementById('q').value=''; search(''); show(t.dataset.p); expanded=false; document.getElementById('expand').textContent='모두 펼치기'; scrollTo(0,0); }; });

function search(term){
  term=term.trim().toLowerCase();
  var none=document.getElementById('none'), any=false;
  var items=document.querySelectorAll('details.slide, details.q, .dn, .gl');
  if(!term){
    items.forEach(function(x){ x.hidden=false; if(x.tagName==='DETAILS') x.open=false; });
    none.hidden=true; show(cur); return;
  }
  Object.keys(panels).forEach(function(k){ document.getElementById(panels[k]).hidden=false; });
  items.forEach(function(x){
    var hit=x.textContent.toLowerCase().indexOf(term)>=0;
    x.hidden=!hit; if(hit) any=true;
    if(x.tagName==='DETAILS') x.open=hit;
  });
  document.querySelectorAll('.panel').forEach(function(p){
    var vis=p.querySelector('details.slide:not([hidden]), .dn:not([hidden]), .gl:not([hidden])');
    p.hidden=!vis;
  });
  none.hidden=any;
}
var qT=null; document.getElementById('q').addEventListener('input',function(e){ clearTimeout(qT); var v=e.target.value; qT=setTimeout(function(){ search(v); },150); });

var expanded=false;
document.getElementById('expand').onclick=function(){
  expanded=!expanded;
  document.querySelectorAll('#'+panels[cur]+' details').forEach(function(d){ d.open=expanded; });
  this.textContent=expanded?'모두 접기':'모두 펼치기';
};
document.getElementById('theme').onclick=function(){
  var r=document.documentElement, dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme=dark?'light':'dark'; try{ localStorage.setItem('mjb-theme',r.dataset.theme); }catch(e){}
};
try{ var th=localStorage.getItem('mjb-theme'); if(th) document.documentElement.dataset.theme=th; var tb=localStorage.getItem('mjb-tab'); if(tb&&panels[tb]) show(tb); }catch(e){}
document.getElementById('toTop').onclick=function(){ scrollTo({top:0,behavior:'smooth'}); };
</script>
