<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>보호자 주간 안부 리포트 · 화면 예시</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f5;color:#233d36;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all}
main{max-width:960px;margin:auto;padding:24px 44px}
header{display:flex;align-items:center;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid #d9e1d9}
.brand{font-size:24px;font-weight:700}.date{font-size:21px;color:#596b64}
.intro{margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.eyebrow{margin:0 0 8px;font-size:21px;color:#596b64}h1{font-size:30px;line-height:1.3;letter-spacing:-.04em;margin:0;font-weight:750}
.status{padding:10px 16px;border-radius:24px;background:#f2e4c9;color:#795423;font-size:20px;white-space:nowrap;font-weight:700}
.risk-scale{display:flex;gap:8px;margin-top:18px;align-items:center}
.risk-scale span{flex:1;padding:9px 12px;text-align:center;font-size:19px;background:#e6eae4;color:#58685f;border-radius:6px}
.risk-scale .selected{background:#f5ddbe;color:#814415;outline:2px solid #a76122;font-weight:800}
.changes{margin-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.change{border-top:2px solid #b8cbc0;padding-top:16px}
.change h2{font-size:21px;color:#596b64;font-weight:500;margin:0 0 10px}
.change p{font-size:28px;font-weight:700;letter-spacing:-.035em;margin:0;line-height:1.4;color:#814415}
.change small{display:block;margin-top:6px;font-size:18px;color:#596b64}
.next{margin-top:22px;background:#e7eee7;padding:16px 24px;border-radius:12px}
.next h2{font-size:21px;margin:0 0 8px;color:#355848}
.next p{font-size:22px;line-height:1.5;margin:0;letter-spacing:-.02em}
footer{margin-top:16px;display:flex;justify-content:space-between;gap:16px;font-size:16px;color:#66766b}
@media(max-width:600px){main{padding:24px}.intro{align-items:start;flex-direction:column}h1{font-size:28px}.changes{grid-template-columns:1fr}.date{font-size:16px}.next p{font-size:20px}footer{flex-direction:column}}
</style>
</head>
<body>
<main>
  <header><div class="brand">마주봄 · 주간 안부</div><div class="date">2026. 08. 23 — 08. 29</div></header>
  <section class="intro">
    <div><p class="eyebrow">낙상 위험도 안내</p><h1>보행 변화가 있어 확인이 필요해요.</h1></div>
  </section>
  <div class="risk-scale" aria-label="위험도 4단계 중 경고 선택: 디자인 예시, 실제 판정 아님"><span>정상</span><span>주의</span><span class="selected">경고</span><span>위험</span></div>
  <section class="changes" aria-label="이전 기록과 비교한 변화">
    <div class="change"><h2>걷는 속도</h2><p>42% 느려졌어요</p><small>이전 평균 0.93 → 이번 주 0.54 m/s</small></div>
    <div class="change"><h2>걸을 때 몸의 흔들림</h2><p>134% 늘었어요</p><small>이전 평균 대비 · 안정성 확인 필요</small></div>
    <div class="change"><h2>밤 동안의 움직임</h2><p>밤에 뒤척임이<br>심해졌어요</p></div>
  </section>
  <section class="next"><h2>간호사와 함께 확인해 주세요</h2><p>최근 걷는 모습과 이동 시 도움이 필요한지 물어보세요.</p></section>
</main>
</body>
</html>
